name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar
        run: gradle assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: KULI-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            fotos/build/outputs/apk/debug/fotos-debug.apk
            ordenes/build/outputs/apk/debug/ordenes-debug.apk
            familia/build/outputs/apk/debug/familia-debug.apk

      - name: Publicar APK como descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KULI MUSIC build ${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            fotos/build/outputs/apk/debug/fotos-debug.apk
            ordenes/build/outputs/apk/debug/ordenes-debug.apk
            familia/build/outputs/apk/debug/familia-debug.apk
          make_latest: true
